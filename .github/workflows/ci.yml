name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Force the "no ppt-master installed" path so the approximate width model and
    # the strict-mode guard are exercised identically on every runner.
    env:
      PAPER_FIG_DECK_NO_BACKEND: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      # The sample workdir must always be valid input for the generator.
      - name: Validate the bundled sample
        run: python pipeline/content_schema.py sample

      # The bundled skill is a thin shell: valid frontmatter, every referenced
      # repo path exists, and no personal identifiers (public-repo rule).
      - name: Validate the bundled skill
        run: |
          python - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("skill/paper-fig-deck/SKILL.md")
          text = p.read_text(encoding="utf-8")
          fm = text.split("---", 2)[1]
          assert "name: paper-fig-deck" in fm, "frontmatter missing name"
          assert "description:" in fm, "frontmatter missing description"
          refs = {m for m in re.findall(r"`<repo>/([^`]+)`", text)}
          missing = [r for r in refs if not pathlib.Path(r).exists()]
          forbidden = [s for s in ("ZZD", "C:/Users", "C:\\Users", "lit7") if s in text]
          if missing or forbidden:
              sys.exit(f"SKILL.md problem: missing={missing} forbidden={forbidden}")
          print(f"SKILL.md ok ({len(refs)} refs)")
          PY

      # Proves the generator runs end to end with the approximate width model.
      # ppt-master is not installed in CI, so --dry-run is the deepest level
      # available here; the gated export needs the real backend.
      - name: Smoke-test the generator on the sample
        run: python pipeline/run_pipeline.py sample --dry-run
