name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Force the "no ppt-master installed" path so the approximate width model and
    # the strict-mode guard are exercised identically on every runner.
    env:
      PAPER_FIG_DECK_NO_BACKEND: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      # The sample workdir must always be valid input for the generator.
      - name: Validate the bundled sample
        run: python pipeline/content_schema.py sample

      # The bundled skill is a thin shell: valid frontmatter, a description short
      # enough for skill indexes, every `<repo>/path` reference resolvable, and no
      # personal identifiers / absolute paths (public-repo rule).
      - name: Validate the bundled skill
        run: |
          python - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("skill/paper-fig-deck/SKILL.md")
          text = p.read_text(encoding="utf-8")
          head, fm, _body = text.split("---", 2)
          assert head.strip() == "", "SKILL.md must start with the frontmatter block"
          name = re.search(r"^name:\s*(\S+)", fm, re.M).group(1)
          desc = re.search(r'^description:\s*"(.+)"', fm, re.M).group(1)
          assert name == p.parent.name, f"name {name!r} != directory {p.parent.name!r}"
          assert len(desc) <= 60, f"description is {len(desc)} chars (max 60)"
          # Match the bare `<repo>/path` form, not only backticked ones: the two
          # entry-point commands are written as
          # `<venv-python> <repo>/pipeline/run_pipeline.py ...`, which a
          # backtick-anchored regex silently misses.
          refs = set(re.findall(r"<repo>/([A-Za-z0-9_./-]+)", text))
          assert len(refs) >= 7, f"only {len(refs)} path refs found - regex drifted?"
          missing = sorted(r for r in refs if not pathlib.Path(r).exists())
          forbidden = [s for s in ("ZZD", "lit7", "C:/Users", "C:\\Users") if s in text]
          abs_paths = re.findall(r"(?<![A-Za-z])[A-Za-z]:[\\/]", text)
          if missing or forbidden or abs_paths:
              sys.exit(f"SKILL.md problem: missing={missing} "
                       f"forbidden={forbidden} abs={abs_paths}")
          print(f"SKILL.md ok ({len(refs)} refs, description {len(desc)} chars)")
          PY

      # Proves the generator runs end to end with the approximate width model.
      # ppt-master is not installed in CI, so --dry-run is the deepest level
      # available here; the gated export needs the real backend.
      - name: Smoke-test the generator on the sample
        run: python pipeline/run_pipeline.py sample --dry-run
