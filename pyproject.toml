[tool.ruff]
target-version = "py310"
line-length = 100
# Only the shipped code is linted: per-paper workdirs (batch dirs full of local
# data) and frozen snapshots must never break the build.
include = ["pipeline/**/*.py", "tests/**/*.py", "sample/**/*.py"]
extend-exclude = ["legacy", "pilot", "sample/images"]

[tool.ruff.lint]
# Start from the correctness floor (syntax errors, undefined names, unused
# imports); tighten over time rather than a big-bang reformat.
select = ["E4", "E7", "E9", "F", "W6", "I"]
ignore = ["E402"]  # modules intentionally extend sys.path before importing kit

[tool.ruff.lint.isort]
known-first-party = ["kit", "layout", "deck", "content_schema"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["pipeline", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:paper_fig_deck.*"]

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/measure_*.py"]
